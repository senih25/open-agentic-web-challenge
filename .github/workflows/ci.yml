name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for accidental secret-like files
        shell: bash
        run: |
          if find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' \) -not -path './.git/*' | grep .; then
            echo "Potential secret-bearing file found."
            exit 1
          fi
      - name: Validate required project documents
        shell: bash
        run: |
          test -s README.md
          test -s docs/CHALLENGE_COMPLIANCE.md
          test -s docs/THREAT_MODEL.md
          test -s spec/pinned/README.md
      - name: Verify pinned challenge specification checksum
        shell: bash
        run: |
          printf '%s  %s\n' \
            '5d12f6f7a6fe50cb34aebd4258af3e8ff6bd81f286e4ade232b8c9b3583f222a' \
            'spec/pinned/worldwide_agentic_web_mvp_spec.md' | sha256sum --check --status
